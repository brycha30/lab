services:
  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}

      # ---- WireGuard (Mullvad) ----
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT}
      - DNS_ADDRESS=${DNS_ADDRESS}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}

      # ---- Allow LAN + NAS subnets to reach published WebUIs ----
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS}
      # Optional explicit inbound allowlist (safe + clear)
      - FIREWALL_INPUT_PORTS=${FIREWALL_INPUT_PORTS}

    ports:
      # WebUIs
      - "8080:8080"     # qB
      - "9696:9696"     # Prowlarr
      - "8989:8989"     # Sonarr
      - "7878:7878"     # Radarr
      - "7879:7879"     # Radarr-kids
      - "7880:7880"     # Radarr-directors (movies-directors)
      - "6767:6767"     # Bazarr
      - "6768:6768"     # Bazarr-kids
      - "6769:6769"     # Bazarr-directors
      - "8191:8191"     # FlareSolverr
      - "5055:5055"     # Overseerr / Seerr
      - "6246:6246"     # Maintainerr

      # qB incoming (match qB settings)
      - "6881:6881"        # TCP
      - "6881:6881/udp"    # UDP

    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${MAIN}:/Main
      - ${MAIN}:/KidsMain
      - ${MAIN}:/DirMain
    restart: unless-stopped
    depends_on:
      - gluetun

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MAIN}:/Main
    restart: unless-stopped
    depends_on:
      - gluetun

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADARR__SERVER__PORT=7878
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MAIN}:/Main
    restart: unless-stopped
    depends_on:
      - gluetun

  radarr-kids:
    image: lscr.io/linuxserver/radarr:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADARR__SERVER__PORT=7879
    volumes:
      - ${CONFIG_ROOT}/radarr-kids:/config
      - ${MAIN}:/KidsMain
      - ${MAIN}:/Main
    restart: unless-stopped
    depends_on:
      - gluetun

  radarr-directors:
    image: lscr.io/linuxserver/radarr:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADARR__SERVER__PORT=7880
    volumes:
      - ${CONFIG_ROOT}/radarr-directors:/config
      - ${MAIN}:/DirMain
      - ${MAIN}:/Main
    restart: unless-stopped
    depends_on:
      - gluetun

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    restart: unless-stopped
    depends_on:
      - gluetun

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    network_mode: "service:gluetun"
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    volumes:
      - ${CONFIG_ROOT}/flaresolver:/config
    restart: unless-stopped
    depends_on:
      - gluetun

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - BAZARR__PORT=6767
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MAIN}:/Main
    restart: unless-stopped
    depends_on:
      - gluetun

  bazarr-kids:
    image: lscr.io/linuxserver/bazarr:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - BAZARR__PORT=6768
    volumes:
      - ${CONFIG_ROOT}/bazarr-kids:/config
      - ${MAIN}:/KidsMain
    restart: unless-stopped
    depends_on:
      - gluetun

  bazarr-directors:
    image: lscr.io/linuxserver/bazarr:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - BAZARR__PORT=6769
    volumes:
      - ${CONFIG_ROOT}/bazarr-directors:/config
      - ${MAIN}:/Main
    restart: unless-stopped
    depends_on:
      - gluetun

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    network_mode: "service:gluetun"
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/maintainerr:/opt/data
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_started
        restart: true

  watchlist-cleanup:
    image: kometateam/kometa:latest
    container_name: watchlist-cleanup
    network_mode: "service:gluetun"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    entrypoint: ["python", "/app/watchlist-cleanup.py"]
    environment:
      - TZ=${TZ}
    volumes:
      - ${WATCHLIST_CLEANUP_ROOT}/watchlist-cleanup.py:/app/watchlist-cleanup.py:ro
      - ${CONFIG_ROOT}/kometa/config.yml:/plex-config.yml:ro
      - ${CONFIG_ROOT}/overseerr/db:/seerr:ro
      - ${MAIN}/media:${MAIN}/media:ro
      - ${KIDS_MAIN}/media:${KIDS_MAIN}/media:ro
      - ${WATCHLIST_CLEANUP_ROOT}/state:/state
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_started
        restart: true
